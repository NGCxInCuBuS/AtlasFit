<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AtlasFit v2</title><style>:root{--accent:#ad91ff;--bg:#101321;--card:#20243b;--text:#f7f5ff;--muted:#b5b9cf;--stroke:#414763}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}header{padding:22px 18px;background:linear-gradient(125deg,var(--card),var(--bg));border-bottom:1px solid var(--stroke)}h1{font-size:26px;margin:0}h2{font-size:20px}h3{margin:4px 0 8px}small,.muted{color:var(--muted)}nav{position:sticky;top:0;z-index:3;display:flex;gap:6px;padding:10px;background:var(--bg);overflow:auto;border-bottom:1px solid var(--stroke)}button,select,input{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--stroke);border-radius:10px;padding:9px}button{cursor:pointer;font-weight:650}button.active,button.primary{background:var(--accent);color:#141222;border-color:var(--accent)}main{padding:10px 14px 50px;max-width:740px;margin:auto}.card{background:var(--card);border:1px solid var(--stroke);border-radius:16px;margin:12px 0;padding:15px}.machine{overflow:hidden;padding:0}.machine .inner{padding:14px}.hero{height:112px;width:100%;display:block;object-fit:cover;background:#171a2a}.row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}.flex{display:flex;align-items:center;gap:10px}.fieldrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.fieldrow label{display:flex;flex:1;min-width:80px;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}.fieldrow input{width:100%;min-width:0}.check{width:24px;height:24px;accent-color:var(--accent)}.chip{display:inline-block;border-radius:100px;background:var(--bg);border:1px solid var(--stroke);padding:5px 10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid .card{margin:0}.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(66px,1fr));gap:7px}.swatch{height:40px;border-radius:9px;border:2px solid var(--stroke);display:flex;align-items:center;justify-content:center}.swatch span{width:19px;height:19px;border-radius:50%}.theme-name{font-size:10px;text-align:center;line-height:1.2;margin-top:5px}.search{width:100%;margin:8px 0}.library-item{padding:12px 0;border-bottom:1px solid var(--stroke)}.library-item:last-child{border:0}.danger{color:#ffb4b4}.note{line-height:1.5;font-size:13px;color:var(--muted)}.musicbtn{min-width:55px;font-size:22px}.pill{background:var(--bg);padding:5px 9px;border-radius:30px;font-size:12px;color:var(--accent)}.listpic{width:85px;height:60px;border-radius:9px;object-fit:cover;background:#111}#toast{position:fixed;z-index:10;bottom:24px;left:50%;transform:translate(-50%,30px);background:var(--accent);color:#141222;padding:13px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;min-width:230px;text-align:center;font-weight:700}#toast.show{opacity:1;transform:translate(-50%,0)}#dialog{position:fixed;inset:0;z-index:9;background:#000a;display:none;align-items:center;justify-content:center;padding:22px}#dialog.open{display:flex}#dialogBody{width:100%;max-width:400px;background:var(--card);border:1px solid var(--stroke);border-radius:18px;padding:23px;box-shadow:0 15px 45px #0008}.musicdock{border-color:var(--accent)}a{color:var(--accent)}
/* Anime-inspired optional appearance presets; all original themes remain available. */
body[data-visual="aincrad"]{--stroke:#3877a3;background:radial-gradient(ellipse at 80% 0%,#174975 0%,transparent 55%),#071528;background-attachment:fixed}body[data-visual="aincrad"] .card{background:linear-gradient(140deg,#143650ef,#0b1e34ed);border-color:#4da9df;box-shadow:0 0 0 1px #20567d,0 8px 28px #010b1c99}body[data-visual="aincrad"] button.active,body[data-visual="aincrad"] button.primary{box-shadow:0 0 18px #4cc7ff55}body[data-visual="aincrad"] header{background:linear-gradient(120deg,#153f69,#081728)}
body[data-visual="monarch"]{--stroke:#60468a;background:radial-gradient(circle at 90% 0%,#38215b 0%,transparent 50%),#0d091b;background-attachment:fixed}body[data-visual="monarch"] .card{background:linear-gradient(155deg,#271940,#160e28);border-color:#7550a8;box-shadow:0 10px 30px #06020f99,0 0 16px #7d43cf19}body[data-visual="monarch"] button.active,body[data-visual="monarch"] button.primary{box-shadow:0 0 18px #9b5cfb70}body[data-visual="monarch"] h2,body[data-visual="monarch"] h3{text-shadow:0 0 15px #af8aff44}
body[data-visual="breathing"]{--stroke:#527c69;background:repeating-linear-gradient(45deg,#102521 0px,#102521 22px,#18382e 22px,#18382e 44px);background-attachment:fixed}body[data-visual="breathing"] .card{background:linear-gradient(135deg,#1c3933f7,#102620f7);border:1px solid #75ae8c;border-radius:8px;box-shadow:inset 3px 0 #62d09a,0 8px 20px #07131088}body[data-visual="breathing"] button{border-radius:7px}body[data-visual="breathing"] header{background:linear-gradient(125deg,#254b3a,#0d1c1b)}
body[data-visual="leaf"]{--stroke:#95683e;background:radial-gradient(circle at 95% 10%,#6b3218 0%,transparent 45%),#25170f;background-attachment:fixed}body[data-visual="leaf"] .card{background:linear-gradient(135deg,#4b2f20f5,#2b1b14f5);border:1px solid #a36c38;border-radius:18px;box-shadow:inset 0 3px #ffa94c44,0 8px 20px #13090488}body[data-visual="leaf"] button.active,body[data-visual="leaf"] button.primary{background:linear-gradient(115deg,#ffb34e,#f47d30)}body[data-visual="leaf"] header{background:linear-gradient(125deg,#6c371f,#281810)}
body[data-visual] nav{background:var(--bg)}body[data-visual] input,body[data-visual] select{border-color:var(--stroke)}
</style></head><body><header><h1>⚡ AtlasFit <small>v2</small></h1><div class="muted">Your gym • Your training • Your soundtrack</div></header><nav><button data-tab="work" onclick="tabTo('work')">Workout</button><button data-tab="library" onclick="tabTo('library')">Machines</button><button data-tab="history" onclick="tabTo('history')">History</button><button data-tab="body" onclick="tabTo('body')">Body</button><button data-tab="music" onclick="tabTo('music')">Music</button><button data-tab="settings" onclick="tabTo('settings')">Settings</button></nav><main id="view"></main><div id="toast" role="status"></div><div id="dialog" onclick="if(event.target===this)closeDialog()"><div id="dialogBody"></div></div><script>
const CATALOG=[{"id":"m0","name":"Treadmill","group":"Cardio","type":"cardio","fields":"speed,time,incline","description":"Walking and running; track mph, minutes, and incline %."},{"id":"m1","name":"Elliptical","group":"Cardio","type":"cardio","fields":"level,time,distance","description":"Low-impact elliptical trainer; track resistance level and duration."},{"id":"m2","name":"Stationary bike","group":"Cardio","type":"cardio","fields":"level,time,distance","description":"Upright cycling cardio machine."},{"id":"m3","name":"Recumbent bike","group":"Cardio","type":"cardio","fields":"level,time,distance","description":"Seated supported cycling cardio machine."},{"id":"m4","name":"Stair climber","group":"Cardio","type":"cardio","fields":"level,time,distance","description":"Stair-stepper; track level and minutes."},{"id":"m5","name":"Rowing machine","group":"Cardio","type":"cardio","fields":"level,time,distance","description":"Rowing cardio machine; not offered at every club."},{"id":"m6","name":"Chest press","group":"Chest","type":"strength","fields":"","description":"Seated pressing movement for chest and triceps."},{"id":"m7","name":"Incline chest press","group":"Chest","type":"strength","fields":"","description":"Upper-chest angled press machine."},{"id":"m8","name":"Pec fly","group":"Chest","type":"strength","fields":"","description":"Chest fly machine; often combined with reverse fly."},{"id":"m9","name":"Shoulder press","group":"Shoulders","type":"strength","fields":"","description":"Seated overhead pressing machine."},{"id":"m10","name":"Lateral raise","group":"Shoulders","type":"strength","fields":"","description":"Lateral deltoid raise machine; location-dependent."},{"id":"m11","name":"Reverse pec deck","group":"Shoulders","type":"strength","fields":"","description":"Rear shoulder fly machine."},{"id":"m12","name":"Lat pulldown","group":"Back","type":"strength","fields":"","description":"Cable pulldown for back."},{"id":"m13","name":"Seated row","group":"Back","type":"strength","fields":"","description":"Seated cable or selectorized back row."},{"id":"m14","name":"High row","group":"Back","type":"strength","fields":"","description":"High pulling back machine; varies by club."},{"id":"m15","name":"Back extension","group":"Back","type":"strength","fields":"","description":"Back extension machine or bench."},{"id":"m16","name":"Leg press","group":"Legs","type":"strength","fields":"","description":"Seated or angled leg press."},{"id":"m17","name":"Seated leg curl","group":"Legs","type":"strength","fields":"","description":"Hamstring curl machine."},{"id":"m18","name":"Lying leg curl","group":"Legs","type":"strength","fields":"","description":"Prone hamstring curl; location-dependent."},{"id":"m19","name":"Leg extension","group":"Legs","type":"strength","fields":"","description":"Quadriceps extension machine."},{"id":"m20","name":"Hip abductor","group":"Legs","type":"strength","fields":"","description":"Outer hip machine."},{"id":"m21","name":"Hip adductor","group":"Legs","type":"strength","fields":"","description":"Inner thigh machine."},{"id":"m22","name":"Glute kickback","group":"Legs","type":"strength","fields":"","description":"Glute kickback machine."},{"id":"m23","name":"Calf raise","group":"Legs","type":"strength","fields":"","description":"Calf raise machine or leg-press variation."},{"id":"m24","name":"Smith machine","group":"Free weights","type":"strength","fields":"","description":"Guided barbell station."},{"id":"m25","name":"Cable crossover","group":"Free weights","type":"strength","fields":"","description":"Adjustable cable station."},{"id":"m26","name":"Dumbbells","group":"Free weights","type":"strength","fields":"","description":"Dumbbell exercises and benches."},{"id":"m27","name":"Biceps curl","group":"Arms","type":"strength","fields":"","description":"Seated biceps curl machine."},{"id":"m28","name":"Triceps extension","group":"Arms","type":"strength","fields":"","description":"Triceps extension machine."},{"id":"m29","name":"Triceps pushdown","group":"Arms","type":"strength","fields":"","description":"Cable pushdown station."},{"id":"m30","name":"Abdominal crunch","group":"Core","type":"strength","fields":"","description":"Seated abdominal crunch machine."},{"id":"m31","name":"Torso rotation","group":"Core","type":"strength","fields":"","description":"Rotational core machine."},{"id":"m32","name":"Captain's chair","group":"Core","type":"strength","fields":"","description":"Knee raise / vertical leg raise station."},{"id":"m33","name":"30-minute express circuit","group":"Circuit","type":"strength","fields":"","description":"Selection of strength stations and timed step stations."}];
const THEMES=[["Atlas Purple","#ad91ff","#101321","#20243b","#f7f5ff"],["Midnight Blue","#5ea6ff","#0c1427","#1b2b43","#f4f9ff"],["Emerald","#40d6a3","#0d211c","#18362d","#f0fff9"],["Crimson","#fb728a","#261017","#3b1d27","#fff4f6"],["Electric Orange","#ffa44b","#281a0f","#3b291b","#fff9ef"],["Neon Green","#a3e635","#171e10","#29351d","#f6ffe8"],["Ocean Teal","#34d5d0","#0c2427","#19383b","#ecffff"],["Royal Gold","#f2cb4e","#252010","#39311d","#fff9df"],["Rose Pink","#f9a4d1","#281725","#3d2638","#fff2fb"],["Arctic Light","#2563eb","#eef3fc","#ffffff","#1b2540"],["Aincrad HUD","#59caff","#071528","#102840","#e9f8ff"],["Shadow Monarch","#a878ff","#0d091b","#201634","#f4edff"],["Breathing Arts","#64d5a0","#0d1c1b","#18342f","#f4fff8"],["Hidden Leaf","#ffad4e","#25170f","#3b291e","#fff6e9"]];
const DEFAULTS=[["Monday · Upper A",["Treadmill","Chest press","Lat pulldown","Seated row","Pec fly"]],["Tuesday · Cardio & Core",["Treadmill","Abdominal crunch","Stationary bike"]],["Thursday · Legs",["Treadmill","Leg press","Seated leg curl","Leg extension","Calf raise","Stationary bike"]],["Friday · Upper B",["Treadmill","Shoulder press","Lateral raise","Lat pulldown","Biceps curl","Triceps extension"]]];
const START={ "Chest press":90,"Lat pulldown":90,"Seated row":90,"Pec fly":40,"Abdominal crunch":75,"Leg press":205,"Seated leg curl":85,"Leg extension":90,"Shoulder press":40,"Lateral raise":10,"Biceps curl":20,"Triceps extension":20};
const byName=name=>CATALOG.find(x=>x.name===name);
const freshItem=name=>{let c=byName(name);return {id:Date.now()+Math.random(),name,kind:c?.type||"strength",weight:START[name]||0,sets:2,reps:12,speed:3.2,time:15,incline:0,level:4,distance:0,done:false}};
const initial=()=>({version:2,theme:0,day:0,plans:DEFAULTS.map(([name,items])=>({name,items:items.map(freshItem)})),history:[],body:[],music:"Spotify"});
let state;try{let raw=window.AtlasStore?AtlasStore.load():localStorage.getItem("atlasfit");state=raw?JSON.parse(raw):initial()}catch(e){state=initial()}
if(!state||!Array.isArray(state.plans))state=initial();
state.history=state.history||[];state.body=state.body||[];state.theme=state.theme||0;state.music=state.music||"Spotify";
for(const p of state.plans){for(const x of p.items){x.kind=x.kind||(byName(x.name)?.type||"strength");if(x.kind==="cardio"){x.speed??=3.2;x.time??=x.reps||15;x.incline??=0;x.level??=4;x.distance??=0}}}
let tab="work",group="All",filter="";
function save(){try{const raw=JSON.stringify(state);if(window.AtlasStore)AtlasStore.save(raw);else localStorage.setItem("atlasfit",raw)}catch(e){alert("Could not save: "+e.message)}}
function esc(x){return String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function setTheme(i){state.theme=i;save();draw()}
function styleTheme(){const t=THEMES[state.theme]||THEMES[0];for(const [k,v] of Object.entries({"--accent":t[1],"--bg":t[2],"--card":t[3],"--text":t[4]}))document.documentElement.style.setProperty(k,v);document.body.dataset.visual=["aincrad","monarch","breathing","leaf"][state.theme-10]||""}
function tabTo(t){tab=t;draw()}
function field(i,key,val){const x=state.plans[state.day].items[i];x[key]=key==="done"?!!val:Number(val)||0;save();if(key==="done")draw()}
function chooseDay(i){state.day=Number(i);save();draw()}
const PHOTO={
"Treadmill":["Treadmill-gym.jpg","GhoziSeptiandri","https://commons.wikimedia.org/wiki/File:Treadmill-gym.jpg"],
"Elliptical":["Elliptical machine.jpg","Cpetro45","https://commons.wikimedia.org/wiki/File:Elliptical_machine.jpg"],
"Lat pulldown":["Diverging Lat Pulldown Machine.jpg","Teddyhtsai","https://commons.wikimedia.org/wiki/File:Diverging_Lat_Pulldown_Machine.jpg"],
"Leg press":["Leg Press Machine.jpg","Paulmcdonald","https://commons.wikimedia.org/wiki/File:Leg_Press_Machine.jpg"]
};
function photo(name){let p=PHOTO[name];return p?"https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(p[0])+"?width=720":null}
function pict(name,kind){const src=photo(name);if(src)return src;let t=THEMES[state.theme]||THEMES[0];let svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 230"><rect width="460" height="230" fill="'+t[2]+'"/><circle cx="360" cy="40" r="100" fill="'+t[1]+'" opacity=".2"/><text x="230" y="100" font-family="Arial" text-anchor="middle" font-size="25" fill="'+t[4]+'">PHOTO COMING SOON</text><text x="230" y="142" font-family="Arial" text-anchor="middle" font-size="18" fill="'+t[4]+'">'+name.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</text></svg>';return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)}
function photoCredit(name){let p=PHOTO[name];return p?'<a style="color:var(--muted);font-size:11px" href="'+p[2]+'">Photo: '+p[1]+' / Wikimedia Commons (license on source)</a>':'<span class="note">Machine photo not yet available</span>'}
let targetDay=0;
function showToast(message){let e=document.getElementById("toast");e.textContent=message;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),3000)}
function openDialog(html){document.getElementById("dialogBody").innerHTML=html;document.getElementById("dialog").classList.add("open")}
function closeDialog(){document.getElementById("dialog").classList.remove("open")}
function chooseMachineDay(id){let x=CATALOG.find(c=>c.id===id);if(!x)return;openDialog('<h3>Add '+esc(x.name)+'</h3><p class="note">Choose the workout day:</p><select id="targetDay" style="width:100%">'+state.plans.map((p,i)=>'<option value="'+i+'" '+(i===state.day?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select><div class="row" style="margin-top:18px"><button onclick="closeDialog()">Cancel</button><button class="primary" onclick="confirmAdd(\''+id+'\')">Add exercise</button></div>')}
function confirmAdd(id){let day=Number(document.getElementById("targetDay").value),x=CATALOG.find(c=>c.id===id);if(!x)return;state.plans[day].items.push(freshItem(x.name));save();closeDialog();showToast(x.name+" added to "+state.plans[day].name)}
function musicDock(){return '<div class="card musicdock"><div class="row"><div><b>♫ Workout music</b><div class="note">Control the active music app</div></div><button onclick="tabTo(\'music\')">Open music</button></div><div class="row" style="justify-content:center;margin-top:10px"><button onclick="media(\'previous\')">⏮</button><button class="primary" onclick="media(\'toggle\')">⏯</button><button onclick="media(\'next\')">⏭</button></div><div class="note" style="margin-top:6px">Track details require Android media access; opening YouTube alone cannot provide them.</div></div>'}
function fields(x,i){const num=(key,label,step)=>'<label>'+label+'<input type="number" min="0" step="'+(step||1)+'" value="'+esc(x[key]??0)+'" onchange="field('+i+',\''+key+'\',this.value)"></label>';
if(x.kind==="cardio"){if(x.name==="Treadmill")return num("speed","Speed mph",0.1)+num("time","Time min",0.5)+num("incline","Incline %",0.5);return num("level","Resistance/level",1)+num("time","Time min",0.5)+num("distance","Distance mi",0.1)}
return num("weight","Weight lb",2.5)+num("sets","Sets",1)+num("reps","Reps",1)}
function work(){let p=state.plans[state.day];return musicDock()+'<div class="card"><div class="row"><h2>'+esc(p.name)+'</h2><span class="pill">'+p.items.filter(x=>x.done).length+'/'+p.items.length+' complete</span></div><select style="width:100%" onchange="chooseDay(this.value)">'+state.plans.map((x,i)=>'<option value="'+i+'" '+(i===state.day?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select><p class="note">Each exercise has its own card. Cardio and strength use different fields. All changes save locally.</p></div>'+p.items.map((x,i)=>'<section class="card machine"><img class="hero" alt="Illustration of '+esc(x.name)+'" src="'+pict(x.name,x.kind)+'" onerror="this.style.display=\'none\'"><div class="inner"><div class="flex"><input class="check" type="checkbox" '+(x.done?'checked':'')+' onchange="field('+i+',\'done\',this.checked)"><div><b>'+esc(x.name)+'</b><div class="muted" style="font-size:12px">'+esc(byName(x.name)?.group||"Custom")+'</div></div></div><div class="fieldrow">'+fields(x,i)+'</div><div>'+photoCredit(x.name)+'</div><div class="row"><button onclick="removeExercise('+i+')">Remove</button><span class="muted" style="font-size:12px">'+(x.kind==="cardio"?"Cardio":"Strength")+'</span></div></div></section>').join('')+'<div class="card"><button onclick="tabTo(\'library\')">+ Browse machine library</button><button onclick="addCustom()">+ Custom exercise</button><button class="primary" onclick="finish()">Save completed workout</button></div>'}
function removeExercise(i){let x=state.plans[state.day].items[i];openDialog('<h3>Remove '+esc(x.name)+'?</h3><p class="note">This removes it from the current plan, not workout history.</p><div class="row"><button onclick="closeDialog()">Cancel</button><button class="primary" onclick="confirmRemove('+i+')">Remove</button></div>')}
function confirmRemove(i){state.plans[state.day].items.splice(i,1);save();closeDialog();draw();showToast("Exercise removed")}
function addCustom(){openDialog('<h3>Add custom exercise</h3><input id="customName" style="width:100%" placeholder="Exercise name"><div class="row" style="margin-top:15px"><button onclick="closeDialog()">Cancel</button><button class="primary" onclick="confirmCustom()">Add</button></div>')}
function confirmCustom(){let name=document.getElementById("customName").value.trim();if(!name)return;state.plans[state.day].items.push(freshItem(name));save();closeDialog();draw();showToast(name+" added")}
function addCatalog(id){chooseMachineDay(id)}
function finish(){let p=state.plans[state.day],done=p.items.filter(x=>x.done);if(!done.length)return alert("Check at least one completed exercise.");state.history.unshift({date:new Date().toISOString().slice(0,10),name:p.name,items:done.map(x=>({...x}))});p.items.forEach(x=>x.done=false);save();tab="history";draw()}
function history(){return '<h2>Workout history</h2>'+(state.history.length?state.history.map((s,i)=>'<div class="card"><div class="row"><b>'+esc(s.name)+'</b><small>'+esc(s.date)+'</small></div>'+s.items.map(x=>'<div class="library-item">'+esc(x.name)+' · '+(x.kind==="cardio"?esc(x.time)+" min"+(x.name==="Treadmill"?" · "+esc(x.speed)+" mph · "+esc(x.incline)+"% incline":""):esc(x.weight)+" lb · "+esc(x.sets)+" × "+esc(x.reps))+'</div>').join('')+'<button onclick="deleteHistory('+i+')">Delete</button></div>').join(''):'<div class="card">No workouts recorded yet.</div>')}
function deleteHistory(i){if(confirm("Delete workout record?")){state.history.splice(i,1);save();draw()}}
function body(){return '<h2>Body progress</h2><div class="grid"><div class="card"><small>Starting weight</small><h2>344 lb</h2></div><div class="card"><small>Latest logged</small><h2>'+(state.body.length?esc(state.body[0].weight)+" lb":"—")+'</h2></div></div><div class="card"><h3>New measurement</h3><div class="fieldrow"><label>Weight lb<input type="number" id="weight" step="0.1"></label><label>Waist inches<input type="number" id="waist" step="0.1"></label></div><button class="primary" onclick="addBody()">Save measurement</button></div>'+state.body.map((x,i)=>'<div class="card row">'+esc(x.date)+' · '+esc(x.weight)+' lb · '+esc(x.waist||"—")+' in <button onclick="delBody('+i+')">×</button></div>').join('')}
function addBody(){let weight=Number(document.getElementById("weight").value),waist=Number(document.getElementById("waist").value);if(weight<50||weight>1000)return alert("Enter a valid weight.");state.body.unshift({date:new Date().toISOString().slice(0,10),weight,waist});save();draw()}
function delBody(i){if(confirm("Delete measurement?")){state.body.splice(i,1);save();draw()}}
function library(){const groups=["All",...new Set(CATALOG.map(x=>x.group))];let found=CATALOG.filter(x=>(group==="All"||x.group===group)&&(x.name+" "+x.description).toLowerCase().includes(filter.toLowerCase()));return '<h2>Planet Fitness machine library</h2><p class="note">Common equipment across Planet Fitness clubs, not a guaranteed local inventory. Verified Wikimedia Commons photos appear where available; remaining machines are clearly labeled as awaiting photos. Photos require an internet connection.</p><input class="search" placeholder="Search machines..." value="'+esc(filter)+'" oninput="filter=this.value;draw()"><div class="row" style="justify-content:flex-start">'+groups.map(g=>'<button '+(group===g?'class="active"':'')+' onclick="setGroup('+JSON.stringify(g).replace(/"/g,'&quot;')+')">'+esc(g)+'</button>').join('')+'</div><div class="card">'+found.map(x=>'<div class="library-item"><div class="flex"><img class="listpic" alt="Illustration" src="'+pict(x.name,x.type)+'"><div style="flex:1"><b>'+esc(x.name)+'</b><div class="note">'+esc(x.description)+'</div><div>'+photoCredit(x.name)+'</div></div></div><button onclick="addCatalog(\''+x.id+'\')">+ Add to a workout day</button></div>').join('')+'</div>'}
function setGroup(g){group=g;draw()}
function music(){const names=["Spotify","YouTube Music","YouTube","SoundCloud","Pandora"];return '<h2>Workout music</h2><div class="card"><h3>Now playing controls</h3><p class="note">Controls send standard Android media-key commands to the currently active music app when Android permits it. They do not log you into music services or guarantee every player responds.</p><div class="row" style="justify-content:center"><button class="musicbtn" onclick="media(\'previous\')">⏮</button><button class="musicbtn primary" onclick="media(\'toggle\')">⏯</button><button class="musicbtn" onclick="media(\'next\')">⏭</button></div></div><div class="card"><h3>Open music service</h3><p class="note">Start a playlist in your chosen service, then return to AtlasFit for controls. Embedded streaming and OAuth integrations are planned for later, subject to each provider’s policies.</p>'+names.map(n=>'<button onclick="openMusic('+JSON.stringify(n).replace(/"/g,'&quot;')+')">'+esc(n)+' ↗</button>').join('')+'</div>'}
function media(cmd){if(window.AtlasMusic)AtlasMusic.control(cmd);else alert("Music controls are available in the Android app.")}
function openMusic(n){if(window.AtlasMusic)AtlasMusic.open(n);else alert("Open "+n+" on your phone.")}
function settings(){return '<h2>Appearance</h2><div class="card"><h3>Choose a theme</h3><div class="themes">'+THEMES.map((t,i)=>'<div onclick="setTheme('+i+')"><div class="swatch" style="background:'+t[2]+';border-color:'+(i===state.theme?t[1]:t[3])+'"><span style="background:'+t[1]+'"></span></div><div class="theme-name">'+esc(t[0])+'</div></div>').join('')+'</div></div><div class="card"><h3>Workout names</h3>'+state.plans.map((p,i)=>'<label style="display:block;margin:12px 0"><small>Day '+(i+1)+'</small><input style="width:100%" value="'+esc(p.name)+'" onchange="state.plans['+i+'].name=this.value;save()"></label>').join('')+'</div><div class="card"><h3>Backup</h3><p class="note">Your data stays on this device. Export it before uninstalling or changing phones.</p><button onclick="backup()">Export JSON</button><input type="file" accept=".json" onchange="restore(this)"><hr><button class="danger" onclick="reset()">Reset all data</button></div>'}
function backup(){let a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(state));a.download="atlasfit-backup.json";a.click()}
function restore(input){let f=input.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.plans)||!Array.isArray(d.history)||!Array.isArray(d.body))throw Error();if(confirm("Replace current data?")){state=d;save();draw()}}catch(e){alert("Invalid backup")}};r.readAsText(f)}
function reset(){if(confirm("Delete all AtlasFit data?")){state=initial();save();draw()}}
function draw(){if(window.atlasBeforeDraw?.())return;styleTheme();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));document.getElementById("view").innerHTML=({work,history,body,library,music,settings})[tab]();window.atlasAfterDraw?.()}
save();draw();
</script><script src="atlas-next.js"></script><script src="atlas-meals.js"></script></body></html>
