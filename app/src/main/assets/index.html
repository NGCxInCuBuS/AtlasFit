<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>AtlasFit</title><style>body{font:16px system-ui;background:#111323;color:#f6f5ff;margin:0}header{background:#292144;padding:22px}h1{margin:0}main{padding:16px;max-width:700px;margin:auto}.card{background:#20243b;border-radius:14px;padding:16px;margin:12px 0}button,input,select{padding:9px;border-radius:8px;border:1px solid #575878;background:#303551;color:white}button{margin:4px}button.primary{background:#bba5ff;color:#181322;font-weight:bold}input[type=number]{width:64px}input[type=checkbox]{width:20px;height:20px}label{display:inline-flex;flex-direction:column;font-size:12px;color:#c6c7d9;margin:4px}.exercise{border-bottom:1px solid #464960;padding:12px 0}.row{display:flex;align-items:center;gap:12px}.muted{color:#b9bacc}nav{display:flex;overflow:auto;background:#151728;padding:8px}nav button{white-space:nowrap}h2{margin-bottom:8px}</style></head><body><header><h1>⚡ AtlasFit</h1><div>Workout & physique tracker</div></header><nav><button onclick="tab='work';draw()">Workout</button><button onclick="tab='history';draw()">History</button><button onclick="tab='body';draw()">Body</button><button onclick="tab='backup';draw()">Backup</button></nav><main id="view"></main><script>
const plans=[['Monday · Upper A',[['Treadmill',0,1,8],['Chest press',90,2,12],['Lat pulldown',90,2,12],['Seated row',90,2,12],['Pec fly',40,2,12]]],['Tuesday · Cardio & Core',[['Treadmill',0,1,20],['Abdominal crunch',75,2,12],['Bird dogs',0,2,8],['Bike',0,1,10]]],['Thursday · Legs',[['Treadmill',0,1,8],['Leg press',205,2,12],['Seated leg curl',85,2,12],['Leg extension',90,2,12],['Calf raises',0,2,15],['Bike',0,1,10]]],['Friday · Upper B',[['Treadmill',0,1,8],['Shoulder press',40,2,12],['Lateral raises',10,2,12],['Lat pulldown',80,2,12],['Biceps curl',20,2,12],['Triceps extension',20,2,12]]]];
const fresh=()=>({plans:plans.map(p=>({name:p[0],items:p[1].map(a=>({name:a[0],weight:a[1],sets:a[2],reps:a[3],done:false}))})),history:[],body:[],day:0});
let s;try{s=JSON.parse(window.AtlasStore?AtlasStore.load():localStorage.getItem('atlasfit'))||fresh()}catch(e){s=fresh()}let tab='work';
function save(){let t=JSON.stringify(s);if(window.AtlasStore)AtlasStore.save(t);else localStorage.setItem('atlasfit',t)}
function safe(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function draw(){let h='',p=s.plans[s.day];if(tab==='work'){h='<div class="card"><h2>'+safe(p.name)+'</h2><select onchange="s.day=+this.value;save();draw()">'+s.plans.map((x,i)=>'<option value="'+i+'" '+(i===s.day?'selected':'')+'>'+safe(x.name)+'</option>').join('')+'</select><p class="muted">Adjust weights, sets and reps. Check each completed exercise.</p></div><div class="card">'+p.items.map((e,i)=>'<div class="exercise"><div class="row"><input type="checkbox" '+(e.done?'checked':'')+' onchange="edit('+i+',\'done\',this.checked)"><b>'+safe(e.name)+'</b></div><label>Weight lb<input type="number" value="'+e.weight+'" onchange="edit('+i+',\'weight\',+this.value)"></label><label>Sets<input type="number" value="'+e.sets+'" onchange="edit('+i+',\'sets\',+this.value)"></label><label>Reps/min<input type="number" value="'+e.reps+'" onchange="edit('+i+',\'reps\',+this.value)"></label><button onclick="remove('+i+')">Remove</button></div>').join('')+'<p><button onclick="add()">+ Add machine</button><button class="primary" onclick="finish()">Save workout</button></p></div>'}
if(tab==='history'){h='<h2>Workout history</h2>'+(s.history.length?s.history.map(a=>'<div class="card"><b>'+safe(a.name)+'</b><p>'+safe(a.date)+'</p>'+a.items.map(e=>'<div>'+safe(e.name)+' · '+e.weight+' lb · '+e.sets+' × '+e.reps+'</div>').join('')+'</div>').join(''):'<div class="card">No saved workouts yet.</div>')}
if(tab==='body'){h='<h2>Body tracker</h2><div class="card">Starting weight: 344 lb<p><label>Weight lb<input id="weight" type="number" step=".1"></label><label>Waist inches<input id="waist" type="number" step=".1"></label></p><button class="primary" onclick="measure()">Save measurement</button></div>'+s.body.map(x=>'<div class="card">'+safe(x.date)+' · '+x.weight+' lb · waist '+(x.waist||'—')+' in</div>').join('')}
if(tab==='backup'){h='<h2>Data & backup</h2><div class="card"><p>Data is stored locally on this phone.</p><button onclick="backup()">Export backup</button><p><input type="file" accept=".json" onchange="restore(this)"></p><button onclick="reset()">Reset everything</button></div>'}
document.getElementById('view').innerHTML=h}
function edit(i,k,v){s.plans[s.day].items[i][k]=v;save();if(k==='done')draw()}
function add(){let name=prompt('Exercise name');if(name?.trim()){s.plans[s.day].items.push({name:name.trim(),weight:0,sets:2,reps:12,done:false});save();draw()}}
function remove(i){if(confirm('Remove exercise?')){s.plans[s.day].items.splice(i,1);save();draw()}}
function finish(){let p=s.plans[s.day],items=p.items.filter(e=>e.done).map(e=>({...e}));if(!items.length)return alert('Check completed exercises first');s.history.unshift({name:p.name,date:new Date().toISOString().slice(0,10),items});p.items.forEach(e=>e.done=false);save();tab='history';draw()}
function measure(){let w=+document.getElementById('weight').value;if(w<50)return alert('Enter weight');s.body.unshift({date:new Date().toISOString().slice(0,10),weight:w,waist:+document.getElementById('waist').value});save();draw()}
function backup(){let a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(s));a.download='atlasfit-backup.json';a.click()}
function restore(el){let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.plans||!d.history||!d.body)throw Error();if(confirm('Replace existing data?')){s=d;save();draw()}}catch(e){alert('Invalid backup')}};r.readAsText(el.files[0])}
function reset(){if(confirm('Delete all progress?')){s=fresh();save();draw()}}draw();
</script></body></html>
